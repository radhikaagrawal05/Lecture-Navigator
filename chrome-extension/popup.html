<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LectureFind</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap');
    
    :root {
      --bg-primary: #0f1419;
      --bg-secondary: #1a202c;
      --bg-tertiary: #242d3d;
      --accent-main: #7c3aed;
      --accent-light: #a78bfa;
      --accent-glow: rgba(124, 58, 237, 0.2);
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-tertiary: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 380px;
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow: hidden;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #1a202c 0%, #242d3d 100%);
      padding: 20px 16px;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .logo {
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo .dot {
      color: var(--accent-main);
    }

    .creator {
      font-size: 0.65rem;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .creator::before {
      content: '✨';
      font-size: 0.7rem;
    }

    /* Form Section */
    .form {
      padding: 16px;
      background: var(--bg-primary);
    }

    .form label {
      display: block;
      font-size: 0.7rem;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    .form input {
      flex: 1;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
      color: var(--text-primary);
      font-size: 0.9rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: all 0.2s ease;
    }

    .form input::placeholder {
      color: var(--text-tertiary);
    }

    .form input:focus {
      background: var(--bg-secondary);
      border-color: var(--accent-main);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .form button {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-main) 0%, #6d28d9 100%);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
      margin-top: 10px;
    }

    .form button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
    }

    .form button:active {
      transform: translateY(0);
    }

    /* Loading State */
    #loading {
      display: none;
      padding: 16px;
      text-align: center;
      color: var(--text-tertiary);
      font-size: 0.85rem;
    }

    .loader {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid var(--accent-glow);
      border-top-color: var(--accent-main);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Results */
    #results {
      max-height: 400px;
      overflow-y: auto;
      padding: 0 16px 16px;
    }

    #results::-webkit-scrollbar {
      width: 6px;
    }

    #results::-webkit-scrollbar-track {
      background: transparent;
    }

    #results::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    #results::-webkit-scrollbar-thumb:hover {
      background: var(--text-tertiary);
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }

    .pill {
      background: var(--accent-glow);
      color: var(--accent-light);
      padding: 5px 11px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 600;
      border: 1px solid rgba(124, 58, 237, 0.3);
    }

    /* Result Cards */
    .result-card {
      background: linear-gradient(135deg, #1a202c 0%, #1e2a3c 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      transition: all 0.2s ease;
    }

    .result-card:hover {
      border-color: var(--accent-main);
      box-shadow: 0 0 12px var(--accent-glow);
      transform: translateX(2px);
    }

    .clip-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 10px;
    }

    .clip-range {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      font-family: 'Outfit', sans-serif;
    }

    .goto-btn {
      background: var(--accent-glow);
      color: var(--accent-light);
      border: 1px solid var(--accent-main);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .goto-btn:hover {
      background: rgba(124, 58, 237, 0.3);
      border-color: var(--accent-light);
      transform: scale(1.05);
    }

    .result-text {
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.6;
      word-break: break-word;
    }

    .highlight {
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.2);
      padding: 0 3px;
      border-radius: 4px;
      font-weight: 600;
    }

    /* Messages */
    .message {
      padding: 12px 0;
      color: var(--text-secondary);
      font-size: 0.84rem;
      line-height: 1.5;
    }

    .message strong {
      color: var(--text-primary);
    }

    .message.error {
      color: var(--danger);
    }

    /* Suggestions */
    .suggestion {
      display: inline-flex;
      margin: 6px 6px 0 0;
      padding: 7px 12px;
      border-radius: 10px;
      background: var(--bg-tertiary);
      color: var(--accent-light);
      font-size: 0.73rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: all 0.2s ease;
    }

    .suggestion:hover {
      border-color: var(--accent-main);
      background: var(--accent-glow);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <div class="logo">Lecture<span class="dot">Find</span></div>
    </div>
    <div class="creator">by Radhika Agrawal</div>
  </div>

  <div class="form">
    <label for="conceptInput">Search Concept</label>
    <div class="input-group">
      <input id="conceptInput" type="text" placeholder="e.g. neural network" autocomplete="off" />
    </div>
    <button id="searchBtn">Find in Lecture</button>
  </div>

  <div id="loading"><span class="loader"></span>Analysing transcript…</div>
  <div id="results"></div>

  <script src="popup.js"></script>
</body>
</html>
